<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PV C1E-C harjoitus</title><style>body{font:16px/1.45 system-ui;margin:0;background:#f3f7fa;color:#17324d}header{background:#123b5d;color:#fff;padding:22px 16px}main{max-width:800px;margin:auto;padding:14px}.bar{position:sticky;top:0;background:#fff;padding:10px;border-bottom:1px solid #ccdce6;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button{font:inherit;border:1px solid #b8cbd8;border-radius:9px;padding:10px;background:#fff;color:#17324d}button{background:#1478ad;color:#fff;border:0}.section{scroll-margin-top:70px}.card{background:#fff;margin:12px 0;padding:15px;border-radius:12px;box-shadow:0 2px 10px #0001}.option{display:block;width:100%;text-align:left;margin:6px 0;background:#fff;color:#17324d;border:1px solid #b8cbd8}.option:disabled{opacity:1}.right{background:#e5f6eb!important;border-color:#198754!important}.wrong{background:#ffeded!important;border-color:#c53030!important}.feedback{display:none;margin-top:10px;padding:10px;background:#eef6fa;border-radius:8px}.answered .feedback{display:block}.section-result{display:none;padding:12px;background:#eaf5fb;border-radius:10px;font-weight:bold}.section-result.show{display:block}.tag{color:#1478ad;font-weight:700}small{color:#617789}.question-image{max-width:100%;height:auto;display:block;margin:12px 0;border-radius:8px}</style></head><body><header><h1>PV C1E-C teoriakoeharjoitus</h1><p>Osat järjestyksessä: PV → C1E → C. Palaute näkyy heti vastauksen jälkeen.</p></header><main><div class="bar"><label for="test">Valitse testi:</label><select id="test"></select><button id="restart">Aloita testi uudelleen</button><span id="status"></span></div><div id="quiz"></div></main><script>const BANK=[{"section": "PV", "q": "Mitä kuljettajan tulee tehdä ennen sotilasajoneuvon käyttöä?", "a": ["Tarkistaa ajoneuvon ja varusteiden kunto", "Vain käynnistää moottori", "Tarkistaa vain polttoaine", "Lähteä heti liikkeelle"], "correct": 0, "feedback": "Ajoneuvo, varusteet ja turvallisuuteen vaikuttavat kohteet tarkistetaan ennen ajoa."}, {"section": "PV", "q": "Miten toimitaan, jos ajoneuvossa havaitaan turvallisuuteen vaikuttava vika?", "a": ["Vika ilmoitetaan ja ajo keskeytetään tarvittaessa", "Vika peitetään", "Ajetaan nopeammin", "Odotetaan seuraavaan huoltoon aina"], "correct": 0, "feedback": "Turvallisuuteen vaikuttavaa vikaa ei saa sivuuttaa."}, {"section": "PV", "q": "Miksi ajoneuvon kuormaus on erityisen tärkeää sotilaskuljetuksessa?", "a": ["Kuorma voi olla painava ja vaikuttaa ajoneuvon hallintaan", "Kuorma ei vaikuta ajoon", "Vain ulkonäkö muuttuu", "Se vaikuttaa vain radioon"], "correct": 0, "feedback": "Kuorman massa ja sijoittelu vaikuttavat jarrutukseen ja vakauteen."}, {"section": "PV", "q": "Miten toimitaan ajoneuvon pysäköinnin jälkeen?", "a": ["Ajoneuvo varmistetaan liikkumista vastaan", "Jätetään moottori aina käyntiin", "Jätetään ovet auki", "Poistutaan tarkistamatta ympäristöä"], "correct": 0, "feedback": "Ajoneuvo on jätettävä turvallisesti varmistettuna."}, {"section": "PV", "q": "Mitä kuljettajan pitää tehdä, jos käsky tai liikennetilanne on epäselvä?", "a": ["Hidastaa tai pysähtyä turvallisesti ja varmistaa toiminta", "Kiihdyttää", "Arvata aina", "Sammuttaa valot"], "correct": 0, "feedback": "Epäselvässä tilanteessa turvallisuus ja varmistaminen ovat etusijalla."}, {"section": "PV", "q": "Miksi ajoneuvon korkeus ja leveys pitää tuntea?", "a": ["Esteet, sillat ja kapeat reitit voivat aiheuttaa vaaran", "Ne vaikuttavat vain polttoaineeseen", "Niillä ei ole merkitystä", "Ne määrittävät aina nopeuden"], "correct": 0, "feedback": "Mitat on huomioitava reittiä ja liikkeitä suunniteltaessa."}, {"section": "PV", "q": "Miten toimitaan, jos kuljettaja väsyy?", "a": ["Pidetään tauko ja ilmoitetaan tarvittaessa tilanteesta", "Jatketaan kahvin avulla aina", "Lisätään nopeutta", "Ajetaan silmät kiinni"], "correct": 0, "feedback": "Väsymys heikentää havainnointia ja ajoneuvon hallintaa."}, {"section": "PV", "q": "Mikä on turvallisen peruutuksen tärkeä periaate?", "a": ["Peruutetaan hitaasti ja käytetään opastajaa tarvittaessa", "Peruutetaan nopeasti", "Luotetaan vain äänimerkkiin", "Katsotaan vain eteen"], "correct": 0, "feedback": "Hidas nopeus ja jatkuva havainnointi vähentävät riskiä."}, {"section": "PV", "q": "Mitä tehdään ennen ajoneuvon siirtämistä suljetulla alueella?", "a": ["Varmistetaan ympäristö ja reitti", "Painetaan torvea ja lähdetään", "Tarkistetaan vain radio", "Avataan kaikki ovet"], "correct": 0, "feedback": "Ympäristö, ihmiset ja esteet on huomioitava."}, {"section": "PV", "q": "Mikä on kuljettajan tärkein tavoite kaikissa tilanteissa?", "a": ["Turvallinen ja hallittu toiminta", "Mahdollisimman suuri nopeus", "Polttoaineen kuluttaminen", "Muiden painostaminen"], "correct": 0, "feedback": "Turvallisuus ohjaa toimintaa myös kiireessä."}, {"section": "C1E", "q": "Mikä on C1E-yhdistelmän suurin sallittu kokonaismassa?", "a": ["7 500 kg", "10 000 kg", "12 000 kg", "18 000 kg"], "correct": 2, "feedback": "C1E-luokan yhdistelmän suurin sallittu kokonaismassa on 12 000 kg."}, {"section": "C1E", "q": "Miksi aisapaino on tärkeä?", "a": ["Se vaikuttaa vetoauton akselipainoihin ja ohjattavuuteen", "Se vaikuttaa vain perävaunun väriin", "Se vapauttaa jarrut", "Se pienentää massaa"], "correct": 0, "feedback": "Liian suuri tai pieni aisapaino voi heikentää yhdistelmän hallintaa."}, {"section": "C1E", "q": "Miten perävaunun kuorma sijoitetaan?", "a": ["Matalalle ja tasaisesti massarajat huomioiden", "Korkealle takaosaan", "Kaikki vetoaisalle", "Vapaasti ilman sidontaa"], "correct": 0, "feedback": "Sijoittelu vaikuttaa vakauteen, akselipainoihin ja aisapainoon."}, {"section": "C1E", "q": "Mitä sivuttaisheilahtelu voi aiheuttaa?", "a": ["Yhdistelmän vakauden menetyksen", "Aina suoristumisen", "Moottorin sammumisen", "Jarrujen vapautumisen"], "correct": 0, "feedback": "Heilahtelu voi voimistua ja johtaa hallinnan menetykseen."}, {"section": "C1E", "q": "Miten heilahtelevaa yhdistelmää käsitellään?", "a": ["Vähennetään nopeutta hallitusti ja vältetään äkkinäisiä liikkeitä", "Kiihdytetään voimakkaasti", "Vedetään käsijarru", "Sammutetaan moottori"], "correct": 0, "feedback": "Rauhallinen nopeuden vähentäminen auttaa palauttamaan vakautta."}, {"section": "C1E", "q": "Miksi perävaunun takapyörät on huomioitava käännöksessä?", "a": ["Ne voivat oikaista sisemmältä ja osua esteeseen", "Ne kulkevat aina ulkokaarteessa", "Ne eivät liiku", "Ne lyhentävät vetoautoa"], "correct": 0, "feedback": "Perävaunu leikkaa kaarretta eri tavalla kuin vetoauto."}, {"section": "C1E", "q": "Mitä tehdään ennen perävaunun irrottamista?", "a": ["Estetään ajoneuvojen liikkuminen ja toimitaan ohjeiden mukaan", "Irrotetaan kaikki johdot heti", "Poistetaan seisontajarru", "Nostetaan tukijalka viimeisenä"], "correct": 0, "feedback": "Yhdistelmä on ensin varmistettava paikallaan pysyväksi."}, {"section": "C1E", "q": "Miten ajetaan liukkaalla yhdistelmällä?", "a": ["Pienennetään nopeutta, kasvatetaan väliä ja ennakoidaan", "Ajetaan kuten kuivalla", "Jarrutetaan myöhään voimakkaasti", "Kytketään aina vapaalle"], "correct": 0, "feedback": "Pito ja jarrutusmatka muuttuvat liukkaalla."}, {"section": "C1E", "q": "Mitä sidonnan tulee estää?", "a": ["Kuorman liikkuminen jarrutuksessa ja kaarteissa", "Renkaiden pyöriminen", "Moottorin lämpeneminen", "Polttoaineen kuluminen"], "correct": 0, "feedback": "Kuorman on pysyttävä paikallaan koko matkan ajan."}, {"section": "C1E", "q": "Mitä tarkistetaan ennen lähtöä?", "a": ["Kytkentä, valot, renkaat, jarrut ja kuorman kiinnitys", "Vain polttoaine", "Vain rekisterikilpi", "Vain vetoauton radio"], "correct": 0, "feedback": "Koko yhdistelmä tarkistetaan ennen liikkeellelähtöä."}, {"section": "C", "q": "Miksi kuorma-auton katvealueet ovat vaarallisia?", "a": ["Niissä voi olla tienkäyttäjiä, joita kuljettaja ei näe", "Ne lyhentävät ajoneuvoa", "Ne parantavat näkyvyyttä", "Niissä ei voi olla vaaraa"], "correct": 0, "feedback": "Katvealueet on tarkistettava erityisesti liikkeellelähdössä ja käännöksissä."}, {"section": "C", "q": "Mitä pitkä jarrutus alamäessä voi aiheuttaa?", "a": ["Jarrujen kuumenemisen ja tehon heikkenemisen", "Parempaa pitoa", "Polttoaineen lisääntymisen", "Perävaunun lyhenemisen"], "correct": 0, "feedback": "Jarrujen lämpeneminen voi heikentää pysähtymistä."}, {"section": "C", "q": "Miksi ajoneuvon kokonaiskorkeus pitää tuntea?", "a": ["Matalat sillat ja rakenteet voivat aiheuttaa törmäyksen", "Korkeus vaikuttaa vain radioon", "Korkeutta ei tarvitse tietää", "Se määrittää aina nopeuden"], "correct": 0, "feedback": "Reitti ja esteet on arvioitava etukäteen."}, {"section": "C", "q": "Mikä pidentää raskaan ajoneuvon jarrutusmatkaa?", "a": ["Suuri massa, nopeus ja liukas tie", "Pienempi nopeus", "Hyvät renkaat", "Pidempi turvaväli"], "correct": 0, "feedback": "Massa, nopeus, pito ja jarrujen tila vaikuttavat."}, {"section": "C", "q": "Miten kuorma-autoa käsitellään kaarteessa?", "a": ["Nopeus sovitetaan etukäteen ja ajolinja suunnitellaan", "Jarrutetaan vasta keskellä kaarretta", "Kiihdytetään aina", "Ajetaan aivan reunaan"], "correct": 0, "feedback": "Raskaan ja pitkän ajoneuvon liike ennakoidaan ennen kaarretta."}, {"section": "C", "q": "Mitä jos ohjaus tuntuu poikkeavalta?", "a": ["Hidastetaan ja pysähdytään turvallisesti vian selvittämiseksi", "Ajetaan nopeammin", "Jatketaan pitkään", "Sammutetaan valot"], "correct": 0, "feedback": "Poikkeava ohjaus voi viitata vakavaan vikaan."}, {"section": "C", "q": "Miksi rengaspaineet ovat tärkeitä?", "a": ["Ne vaikuttavat vakauteen, kulumiseen ja turvallisuuteen", "Vain radioon", "Ne korvaavat kuorman sidonnan", "Niillä ei ole vaikutusta"], "correct": 0, "feedback": "Väärä rengaspaine heikentää ajo-ominaisuuksia."}, {"section": "C", "q": "Miten märällä tiellä toimitaan?", "a": ["Vähennetään nopeutta ja kasvatetaan turvaväliä", "Ajetaan samalla nopeudella", "Jarrutetaan myöhään", "Kytketään vapaalle aina"], "correct": 0, "feedback": "Märkä tie voi heikentää pitoa ja pidentää jarrutusmatkaa."}, {"section": "C", "q": "Miksi kuorma tarkistetaan myös matkan aikana?", "a": ["Sidonnat voivat löystyä ja kuorma siirtyä", "Polttoaine lisääntyy", "Ajoneuvo lyhenee", "Liikennemerkit vaihtuvat"], "correct": 0, "feedback": "Kuorman turvallisuus voi muuttua ajon aikana."}, {"section": "C", "q": "Mikä on ennakoivan ajon tavoite?", "a": ["Tunnistaa vaarat ajoissa ja välttää äkilliset tilanteet", "Ajaa mahdollisimman nopeasti", "Jarruttaa viime hetkellä", "Ohittaa kaikki hitaat ajoneuvot"], "correct": 0, "feedback": "Ennakointi antaa aikaa ja vähentää riskejä."}, {"section": "PV", "q": "Miksi ajoneuvon käyttöohjeet ja määräykset on tunnettava?", "a": ["Niiden avulla ajoneuvoa käytetään turvallisesti ja oikein", "Vain polttoaineen säästämiseksi", "Koska ne korvaavat tarkastukset", "Niitä tarvitaan vain katsastuksessa"], "correct": 0, "feedback": "Ohjeet ja määräykset määrittävät turvallisen käytön."}, {"section": "PV", "q": "Mitä tehdään onnettomuuspaikalla ensimmäiseksi?", "a": ["Varmistetaan oma ja muiden turvallisuus sekä hälytetään apua tarvittaessa", "Siirretään kaikki ajoneuvot heti", "Jatketaan tehtävää", "Otetaan kuvia ennen turvallisuutta"], "correct": 0, "feedback": "Onnettomuuspaikalla estetään lisävahingot ja hälytetään apua."}, {"section": "PV", "q": "Miksi kuljettajan kuormitus ja stressi on huomioitava?", "a": ["Ne voivat heikentää päätöksentekoa ja havainnointia", "Ne parantavat aina reaktioaikaa", "Niillä ei ole vaikutusta", "Ne vaikuttavat vain matkustusmukavuuteen"], "correct": 0, "feedback": "Kuormitus voi heikentää turvallista toimintaa."}, {"section": "C1E", "q": "Mitä akselimassojen ylittäminen voi aiheuttaa?", "a": ["Ajoneuvon hallinnan, renkaiden ja rakenteiden kuormittumista", "Parempaa jarrutusta", "Pienemmän kulutuksen", "Lyhyemmän jarrutusmatkan"], "correct": 0, "feedback": "Jokaisen akselin sallittu massa on huomioitava erikseen."}, {"section": "C1E", "q": "Miksi perävaunun tukijalkaa käytetään irrotettaessa?", "a": ["Se tukee perävaunua turvallisesti irrotuksen jälkeen", "Se lisää moottorin tehoa", "Se vapauttaa kaikki jarrut", "Se vähentää perävaunun massaa"], "correct": 0, "feedback": "Perävaunun pitää pysyä vakaana myös irrotettuna."}, {"section": "C1E", "q": "Miten perävaunun rengasrikon yhteydessä toimitaan?", "a": ["Pysähdytään turvallisesti, varoitetaan muuta liikennettä ja selvitetään tilanne", "Ajetaan lähimmälle huoltoasemalle kovaa", "Jarrutetaan käsijarrulla", "Jatketaan, jos rengas ei vielä irtoa"], "correct": 0, "feedback": "Rengasrikko voi muuttaa yhdistelmän hallintaa nopeasti."}, {"section": "C1E", "q": "Miksi yhdistelmän kokonaispituus on tärkeä?", "a": ["Kääntyminen, ohittaminen ja pysähtyminen vaativat enemmän tilaa", "Se vaikuttaa vain pysäköintimaksuun", "Se lyhentää jarrutusmatkaa", "Sillä ei ole merkitystä"], "correct": 0, "feedback": "Pitkä yhdistelmä vaatii ennakointia ja tilaa."}, {"section": "C", "q": "Mitä moottorin lämpötilan nousu voi merkitä?", "a": ["Jäähdytysjärjestelmän vikaa tai ylikuumenemista", "Parempaa polttoainetaloutta", "Renkaiden parempaa pitoa", "Toimivaa seisontajarrua"], "correct": 0, "feedback": "Ylikuumenemista ei pidä sivuuttaa."}, {"section": "C", "q": "Miksi oikea vaihde valitaan ennen alamäkeä?", "a": ["Ajoneuvoa ja nopeutta voidaan hallita paremmin", "Moottori sammuu nopeammin", "Jarrut muuttuvat tarpeettomiksi", "Kuljettaja näkee paremmin"], "correct": 0, "feedback": "Ajoneuvon hallinta suunnitellaan ennen mäkeä."}, {"section": "C", "q": "Mitä taloudellinen ajo yleensä tarkoittaa?", "a": ["Ennakoivaa ja tasaista ajamista sekä turhia kiihdytyksiä välttäen", "Aina suurinta mahdollista nopeutta", "Moottorin käyttämistä tyhjäkäynnillä", "Rengaspaineiden sivuuttamista"], "correct": 0, "feedback": "Ennakointi parantaa sekä turvallisuutta että taloudellisuutta."}, {"section": "C", "q": "Miksi kuorma-auton peilit säädetään ennen ajoa?", "a": ["Katvealueita ja ympäristöä voidaan seurata paremmin", "Ne pienentävät auton massaa", "Ne korvaavat suuntamerkin", "Ne lisäävät moottorin tehoa"], "correct": 0, "feedback": "Oikea peilisäätö parantaa havainnointia."}, {"section": "C1E", "q": "Mitä kytkennän jälkeen tarkistetaan erityisesti?", "a": ["Kytkentälaitteen lukittuminen, varmistus ja johdot", "Vain vetoauton radio", "Vain perävaunun väri", "Ainoastaan polttoaine"], "correct": 0, "feedback": "Kytkentä on varmistettava sekä mekaanisesti että sähkö- ja jarruliitäntöjen osalta."}, {"section": "C1E", "q": "Miksi kuorman painopisteen korkeus on tärkeä?", "a": ["Korkea painopiste lisää kallistumis- ja kaatumisherkkyyttä", "Se lyhentää jarrutusmatkaa", "Se poistaa aisapainon", "Sillä ei ole vaikutusta"], "correct": 0, "feedback": "Kuorman sijoittelu vaikuttaa yhdistelmän vakauteen."}, {"section": "C1E", "q": "Mitä ohituksessa pitää huomioida pitkällä yhdistelmällä?", "a": ["Ohitukseen tarvitaan enemmän aikaa ja tilaa", "Ohitus onnistuu aina nopeasti", "Perävaunu ei vaikuta ohitukseen", "Vastaantulevaa liikennettä ei tarvitse arvioida"], "correct": 0, "feedback": "Yhdistelmän pituus ja kiihtyvyys vaikuttavat ohitukseen."}, {"section": "C", "q": "Mitä tapahtuu, jos nopeus kaksinkertaistuu?", "a": ["Jarrutusmatka ja törmäysenergia kasvavat merkittävästi", "Jarrutusmatka puolittuu", "Ajoneuvo pysähtyy yhtä nopeasti", "Massa pienenee"], "correct": 0, "feedback": "Nopeuden vaikutus jarrutusmatkaan ja törmäysvoimaan on erittäin suuri."}, {"section": "C", "q": "Miten toimitaan hätäjarrutuksessa?", "a": ["Pidetään ajolinja hallinnassa ja jarrutetaan tilanteen vaatimalla tavalla", "Vaihdetaan heti vapaalle", "Käännetään voimakkaasti sivuun ilman tarkkailua", "Vedetään käsijarru aina"], "correct": 0, "feedback": "Hätäjarrutuksessa hallinta ja ajolinjan säilyttäminen ovat tärkeitä."}, {"section": "C", "q": "Miksi reitti suunnitellaan kuorma-autolle etukäteen?", "a": ["Mitat, massat, sillat, kapeikot ja rajoitukset voidaan huomioida", "Vain polttoaineen vuoksi", "Reittiä ei tarvitse suunnitella", "Jotta voi ajaa nopeammin"], "correct": 0, "feedback": "Ajoneuvon mitat ja massat rajoittavat mahdollisia reittejä."}, {"section": "PV", "q": "Mitä auttamisvelvollisuus tarkoittaa onnettomuudessa?", "a": ["Kuljettajan tulee auttaa kykynsä mukaan ja hälyttää apua", "Paikalta poistutaan heti", "Vain ajoneuvo kuvataan", "Vastuu kuuluu aina toiselle"], "correct": 0, "feedback": "Onnettomuuspaikalla toimitaan turvallisesti ja apua hälytetään tarvittaessa."}, {"section": "C1E", "q": "Kumpi kuorman sijoittelu on vakaampi?", "a": ["Korkea ja taakse painottuva", "Matala ja tasaisesti jaettu", "Kaikki paino vetoaisalle", "Kuorma ilman sidontaa"], "correct": 1, "feedback": "Matala ja tasaisesti jaettu kuorma pitää painopisteen alempana.", "image": "<svg viewBox=\"0 0 500 130\" role=\"img\" aria-label=\"Kaksi perävaunua: vasemmalla korkea kuorma, oikealla matala kuorma\"><rect x=\"25\" y=\"70\" width=\"190\" height=\"35\" fill=\"#9bb8c9\"/><rect x=\"70\" y=\"25\" width=\"110\" height=\"45\" fill=\"#d77b55\"/><text x=\"70\" y=\"122\">A: korkea kuorma</text><rect x=\"280\" y=\"70\" width=\"190\" height=\"35\" fill=\"#9bb8c9\"/><rect x=\"335\" y=\"48\" width=\"90\" height=\"22\" fill=\"#5b9b72\"/><text x=\"330\" y=\"122\">B: matala kuorma</text></svg>"}, {"section": "C1E", "q": "Kuvassa kuorma-auto-yhdistelmä kääntyy oikealle. Mikä on tärkein huomio?", "a": ["Perävaunu kulkee aina vetoauton samaa ajolinjaa", "Perävaunun takapyörät voivat oikaista sisäkaarteessa", "Kääntyessä pitää aina kiihdyttää", "Yhdistelmän pituudella ei ole merkitystä"], "correct": 1, "feedback": "Perävaunu leikkaa kaarretta sisemmältä. Käännös on tehtävä riittävän laajana ja rauhallisesti.", "image": "website-images/right-turn-swept-path.png"}, {"section": "C", "q": "Kuvassa yhdistelmä peruuttaa lastausalueelle. Mikä on tärkeää?", "a": ["Peruuttaa nopeasti", "Tarkistaa peilit, katvealueet ja käyttää opastajaa tarvittaessa", "Katsoa vain suoraan taakse", "Luottaa siihen, että perävaunu seuraa samaa linjaa"], "correct": 1, "feedback": "Peruutettaessa katvealueet ovat suuria. Hidas nopeus ja tarvittaessa opastaja lisäävät turvallisuutta.", "image": "website-images/reversing-blind-zones.png"}, {"section": "C", "q": "Mitä kuvassa olevan kaltaisessa pitkässä alamäessä pitää ennakoida?", "a": ["Jarrujen kuumeneminen ja hallitun nopeuden säilyttäminen", "Vapaalle vaihtaminen", "Nopeuden lisääminen", "Seisontajarrun käyttäminen ajon aikana"], "correct": 0, "feedback": "Pitkä jarrutus voi kuumentaa jarruja. Nopeus ja sopiva vaihde valitaan ennakkoon.", "image": "website-images/wet-downhill-braking.png"}, {"section": "C", "q": "Miten toimitaan, jos reitillä on ajoneuvoa matalampi silta?", "a": ["Ajetaan hitaasti alle", "Tarkistetaan korkeusrajoitus ja valitaan sopiva reitti", "Ajetaan keskeltä siltaa", "Perävaunu nostetaan käsin"], "correct": 1, "feedback": "Ajoneuvon korkeus ja reitin rajoitukset on varmistettava ennen sillalle ajoa.", "image": "website-images/low-bridge-height.png"}];const COUNTS={PV:5,C1E:10,C:6};let quiz=document.getElementById('quiz'),testSelect=document.getElementById('test'),status=document.getElementById('status'),current=[],score={};for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent='Testi '+i;testSelect.appendChild(o)}function order(a,seed){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function start(){let t=+testSelect.value;localStorage.setItem('pvC1ECtest',t);score={PV:0,C1E:0,C:0};current=[];for(let section of ['PV','C1E','C']){let pool=BANK.filter(x=>x.section===section);let chosen=order(pool,t).slice(0,COUNTS[section]);current.push(...chosen)}render();status.textContent='Testi '+t}function render(){let html='',index=0;for(let section of ['PV','C1E','C']){let count=COUNTS[section];html+=`<section class="section" id="sec${section}"><h2>${section}-osio (${count} kysymystä)</h2>`;for(let j=0;j<count;j++,index++){let x=current[index],i=index;html+=`<article class="card" id="q${i}"><div class="tag">${section} · kysymys ${j+1}/${count}</div><h3>${x.q}</h3>${x.image?'<img class="question-image" src="'+x.image+'" alt="Kuvallinen liikennetilanne">':''}${order(x.a,index+1).map((text,k)=>{let original=x.a.indexOf(text);return `<button class="option" data-i="${i}" data-a="${original}">${String.fromCharCode(65+k)}) ${text}</button>`}).join('')}<div class="feedback"></div></article>`}html+='</section>'}html+='<div class=section-result id=allResults></div>';quiz.innerHTML=html;document.querySelectorAll('.option').forEach(b=>b.onclick=answer)}function answer(e){let b=e.currentTarget,i=+b.dataset.i,a=+b.dataset.a,box=document.getElementById('q'+i);if(box.classList.contains('answered'))return;box.classList.add('answered');let x=current[i];box.querySelectorAll('.option').forEach(o=>{o.disabled=true;if(+o.dataset.a===x.correct)o.classList.add('right');if(+o.dataset.a===a&&a!==x.correct)o.classList.add('wrong')});let ok=a===x.correct;if(ok)score[x.section]++;box.querySelector('.feedback').textContent=(ok?'Oikein. ':'Väärin. Oikea vastaus on '+String.fromCharCode(65+x.correct)+'. ')+x.feedback;let done=document.querySelectorAll('.answered').length;if(done===current.length){let r=document.getElementById('allResults');r.innerHTML='<h2>Testin tulokset</h2><p>PV-osio: '+score.PV+' / '+COUNTS.PV+' oikein</p><p>C1E-osio: '+score.C1E+' / '+COUNTS.C1E+' oikein</p><p>C-osio: '+score.C+' / '+COUNTS.C+' oikein</p><p><b>Yhteensä: '+(score.PV+score.C1E+score.C)+' / '+current.length+' oikein</b></p>';r.classList.add('show');}}testSelect.value=localStorage.getItem('pvC1ECtest')||'1';testSelect.onchange=start;document.getElementById('restart').onclick=start;start();</script></body></html>
